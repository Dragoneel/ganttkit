name: Release

on:
  push:
    branches:
      - main
  # Lets a partial publish be retried without an empty commit.
  workflow_dispatch:

# Two releases at once would race on the version bump and the tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ci.yml only gates pull requests, and this workflow can publish straight
      # off a push, so the same gates run here before anything is released.
      - name: Type checking
        run: pnpm typecheck

      - name: Linting
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # A version bump only happens when a changeset is waiting. Without one
      # this is a plain push, and the publish step below is a no-op.
      - name: Look for pending changesets
        id: pending
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the version bump
        if: steps.pending.outputs.found == 'true'
        run: pnpm changeset:version

      # The bump rewrites the workspace versions, so the lockfile follows.
      - name: Refresh the lockfile
        if: steps.pending.outputs.found == 'true'
        run: pnpm install --no-frozen-lockfile

      # Pushed with GITHUB_TOKEN, and a GITHUB_TOKEN push deliberately does not
      # start another workflow run, so this cannot loop back into itself.
      - name: Commit the version bump
        if: steps.pending.outputs.found == 'true'
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Version bump produced no changes.' >&2
            exit 1
          fi
          git commit -m "Release v$version"
          git push
          echo "Released v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build all packages
        run: pnpm build

      # Deliberately not gated on a changeset being present. `changeset publish`
      # skips anything already on npm, so an ordinary push is a no-op, while a
      # release that published only part of the workspace - npm returns a 409
      # often enough when several new packages land at once - is finished by the
      # next push or by a manual run of this workflow.
      - name: Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
